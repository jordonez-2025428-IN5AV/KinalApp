<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle Venta</title>
    <link rel="stylesheet" th:href="@{/css/form.css}">
</head>
<body>

<div class="form-container">
    <header class="page-header">
        <h2>Nuevo Detalle de Producto</h2>
    </header>

    <form th:action="@{/view/detalle-ventas/guardar}" th:object="${detalle}" method="post">
        <label>Código de Detalle</label>
        <input type="text" th:field="*{codigoDetalleVenta}" placeholder="Código">

        <label>Cantidad</label>
        <input type="number" th:field="*{cantidad}" placeholder="0">

        <label>Precio Unitario (Q)</label>
        <input type="number" step="0.01" th:field="*{precioUnitario}" placeholder="0.00">

        <label>Precio Total (Q)</label>
        <input type="number" step="0.01" th:field="*{precioTotal}" placeholder="0.00">

        <button type="submit" class="btn-search" style="width: 100%;">Guardar Detalle</button>
        <a th:href="@{/view/detalle-ventas}" class="cancel">← Regresar a Detalles</a>
    </form>
</div>

</body>
</html>
