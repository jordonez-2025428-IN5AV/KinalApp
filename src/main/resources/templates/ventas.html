<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div class="main-content">
    <header class="page-header">
        <h1>Ventas</h1>
        <div>
            <a th:href="@{/view/ventas/nuevo}" class="btn">Agregar</a>
            <a th:href="@{/home}" class="btn-logout">Dashboard</a>
        </div>
    </header>

    <form th:action="@{/view/ventas/buscar}" method="get">
        <input type="text" name="q" class="input-search" placeholder="Buscar venta por código...">
        <button type="submit" class="btn-search">Buscar</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>Código</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Usuario</th>
            <th>Total</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${lista}">
            <td th:text="${v.codigoVenta}"></td>
            <td th:text="${v.fechaVenta}"></td>
            <td th:text="${v.cliente != null ? v.cliente.nombreCliente : 'N/A'}"></td>
            <td th:text="${v.usuario != null ? v.usuario.username : 'N/A'}"></td>
            <td th:text="'Q' + ${v.precioVenta}"></td>
            <td class="action-buttons">
                <a th:href="@{/view/ventas/editar/{id}(id=${v.codigoVenta})}" class="btn-edit">Editar</a>
                <a th:href="@{/view/ventas/eliminar/{id}(id=${v.codigoVenta})}" class="btn-delete" onclick="return confirm('¿Anular venta?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
