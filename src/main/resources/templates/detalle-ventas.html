<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Ventas</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div class="main-content">
    <header class="page-header">
        <h1>Detalle Ventas</h1>
        <div>
            <a th:href="@{/view/detalle-ventas/nuevo}" class="btn">Agregar</a>
            <a th:href="@{/view/ventas}" class="btn-logout">Ventas</a>
            <a th:href="@{/home}" class="btn-logout">Dashboard</a>
        </div>
    </header>

    <form th:action="@{/view/detalle-ventas/buscar}" method="get">
        <input type="text" name="codigo" placeholder="Buscar por código">
        <button type="submit">Buscar</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>Código</th>
            <th>Venta</th>
            <th>Cantidad</th>
            <th>Precio Unitario</th>
            <th>Total</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${lista}">
            <td th:text="${d.codigoDetalleVenta}"></td>
            <td th:text="${d.venta != null ? d.venta.codigoVenta : 'N/A'}"></td>
            <td th:text="${d.cantidad}"></td>
            <td th:text="${'Q' + d.precioUnitario}"></td>
            <td th:text="${'Q' + d.precioTotal}"></td>
            <td class="action-buttons">
                <a th:href="@{/view/detalle-ventas/editar/{id}(id=${d.codigoDetalleVenta})}" class="btn-edit">Editar</a>
                <a th:href="@{/view/detalle-ventas/eliminar/{id}(id=${d.codigoDetalleVenta})}" class="btn-delete" onclick="return confirm('¿Eliminar detalle?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
