<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp | Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <a th:href="@{/index}" class="btn-back">
        <i class="fas fa-arrow-left"></i> Volver al Dashboard
    </a>

    <header class="page-header">
        <h1>Gestión de Usuarios</h1>
        <p>Lista de personal con acceso al sistema</p>
    </header>

    <table>
        <thead>
        <tr>
            <th>Código</th>
            <th>Nombre de Usuario</th>
            <th>Email</th>
            <th>Rol / Cargo</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${lista}">
            <td th:text="${u.codigoUsuario}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.rol}"></td>
            <td>
                        <span th:class="${u.estado == 1 ? 'badge badge-active' : 'badge badge-inactive'}"
                              th:text="${u.estado == 1 ? 'Activo' : 'Inactivo'}">
                        </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
