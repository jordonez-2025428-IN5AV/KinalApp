<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp | Clientes</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="main-content">

    <a th:href="@{/index}" class="btn-back">
        <i class="fas fa-arrow-left"></i> Volver al Dashboard
    </a>

    <header class="page-header">
        <h1>Directorio de Clientes</h1>
    </header>

    <table>
        <thead>
        <tr>
            <th>DPI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${lista}">
            <td th:text="${c.DPICliente}"></td>
            <td th:text="${c.nombreCliente}"></td>
            <td th:text="${c.apellidoCliente}"></td>
            <td th:text="${c.direccionCliente}"></td>
            <td th:text="${c.estado == 1 ? 'Activo' : 'Inactivo'}"></td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
