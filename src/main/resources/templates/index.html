<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalApp | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <span class="logo"><i class="fas fa-rocket"></i> KinalApp</span>
        <div class="user-menu">
            <span class="user-name" th:text="${session.usuarioLogueado}">Admin</span>
            <a th:href="@{/logout}" class="btn-logout" title="Cerrar Sesión">
                <i class="fas fa-power-off"></i>
            </a>
        </div>
    </div>
</nav>

<div class="main-content">
    <header class="page-header">
        <h1>Panel de Administración</h1>
        <p>Gestiona los módulos del sistema de forma centralizada</p>
    </header>

    <div class="dashboard-grid">
        <a th:href="@{/view/clientes}" class="card">
            <div class="icon-circle bg-blue"><i class="fas fa-users"></i></div>
            <div class="card-info">
                <h3>Clientes</h3>
                <p>Cartera y contactos</p>
            </div>
        </a>

        <a th:href="@{/view/productos}" class="card">
            <div class="icon-circle bg-orange"><i class="fas fa-box"></i></div>
            <div class="card-info">
                <h3>Productos</h3>
                <p>Inventario y stock</p>
            </div>
        </a>

        <a th:href="@{/view/ventas}" class="card">
            <div class="icon-circle bg-green"><i class="fas fa-shopping-cart"></i></div>
            <div class="card-info">
                <h3>Ventas</h3>
                <p>Registro de facturación</p>
            </div>
        </a>

        <a th:href="@{/view/detalle-ventas}" class="card">
            <div class="icon-circle bg-purple"><i class="fas fa-list-check"></i></div>
            <div class="card-info">
                <h3>Detalle Ventas</h3>
                <p>Desglose de artículos</p>
            </div>
        </a>

        <a th:href="@{/view/usuarios}" class="card">
            <div class="icon-circle bg-red"><i class="fas fa-user-shield"></i></div>
            <div class="card-info">
                <h3>Usuarios</h3>
                <p>Control de accesos</p>
            </div>
        </a>
    </div>
</div>

</body>
</html>
